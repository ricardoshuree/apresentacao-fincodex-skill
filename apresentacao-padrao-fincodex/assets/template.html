<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{PRESENTATION_TITLE}}</title>
{{GOOGLE_FONTS_LINK}}
<style>
/* ══════════════════════════════════════════════════════
   THEME VARIABLES — preenchido na Fase 3 pelo Claude
   Placeholder: {{THEME_CSS_VARIABLES}}
══════════════════════════════════════════════════════ */
:root {
  {{THEME_CSS_VARIABLES}}

  /* Typography scale — fixo, não muda com o tema */
  --fs-display: clamp(56px, 7vw, 96px);
  --fs-h1:      clamp(40px, 5vw, 72px);
  --fs-h2:      clamp(28px, 3.6vw, 48px);
  --fs-h3:      clamp(22px, 2.4vw, 32px);
  --fs-body-lg: clamp(18px, 1.5vw, 24px);
  --fs-body: 18px; --fs-small: 14px; --fs-mono: 13px;
  --radius: 12px; --radius-sm: 8px; --radius-xs: 4px;
  --slide-max-w: 1280px;
}

/* ── TRANSIÇÕES SUAVES (claro ↔ escuro) ──────────── */
html { transition: background-color .42s ease; }
body { transition: background-color .42s ease, color .32s ease; }
.slide, .comp-card, .stat-card, .flow-node, .nav-arrow,
#mode-toggle, #roteiro-btn, #bottom-nav, .badge, .eyebrow,
.detail-panel, .agenda-item {
  transition: background-color .38s ease, border-color .32s ease,
              color .28s ease, box-shadow .32s ease !important;
}
/* Preserva animações de movimento */
.flow-edge-dot, .badge-live::before, #progress-bar { transition: none !important; }

/* ── RESET ──────────────────────────────────────── */
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html, body {
  height:100%; overflow:hidden;
  background: var(--brand-bg); color: var(--text-primary);
  font-family: var(--font-body); font-size: var(--fs-body);
  line-height: 1.5; -webkit-font-smoothing: antialiased;
}

/* ── PROGRESS BAR ───────────────────────────────── */
#progress-bar {
  position:fixed; top:0; left:0; height:3px;
  background: var(--brand-primary);
  transition: width .4s cubic-bezier(.25,.46,.45,.94);
  z-index:1000; box-shadow: 0 0 8px var(--brand-primary-glow);
}

/* ── SLIDE ENGINE ───────────────────────────────── */
.slide {
  display:none; width:100%; height:100vh; overflow-y:auto;
  padding: 60px 40px 100px;
}
.slide.active { display:flex; flex-direction:column; }
.slide-inner {
  max-width: var(--slide-max-w); width:100%; margin:0 auto;
  animation: slideIn .45s ease;
  display:flex; flex-direction:column; justify-content:center;
  min-height: calc(100vh - 160px); gap: 28px;
}
@keyframes slideIn {
  from { opacity:0; transform:translateY(18px); }
  to   { opacity:1; transform:translateY(0); }
}

/* ── BOTTOM NAV ─────────────────────────────────── */
#bottom-nav {
  position:fixed; bottom:0; left:0; right:0; height:56px;
  display:flex; align-items:center; justify-content:center; gap:12px;
  background: linear-gradient(transparent, var(--brand-bg) 40%);
  z-index:999; padding-top:20px;
}
.nav-arrow {
  width:36px; height:36px; border-radius:50%;
  border:1px solid var(--brand-border-hi);
  background: var(--brand-surface); color: var(--text-secondary);
  cursor:pointer; display:flex; align-items:center; justify-content:center;
  font-size:14px; transition:all .2s;
}
.nav-arrow:hover { border-color: var(--brand-primary); color: var(--brand-primary); }
#slide-counter {
  font-family: var(--font-mono); font-size:13px;
  color: var(--text-muted); min-width:60px; text-align:center;
}
.nav-dots { display:flex; gap:6px; }
.nav-dot {
  width:8px; height:8px; border-radius:50%;
  background: var(--brand-border-hi); cursor:pointer; transition:all .3s;
}
.nav-dot.active { background: var(--brand-primary); box-shadow: 0 0 8px var(--brand-primary-glow); }

/* Separador vertical no nav */
.nav-sep { width:1px; height:20px; background: var(--brand-border-hi); opacity:.5; }

/* Botões CLARO/ESCURO e R (estilo pill Falconi) */
#mode-toggle, #roteiro-btn {
  display:inline-flex; align-items:center; gap:7px;
  padding:5px 14px 5px 10px; border-radius:999px;
  border:1px solid var(--brand-border-hi); background: var(--brand-surface-2);
  cursor:pointer; font-family: var(--font-mono); font-size:10px;
  letter-spacing:1.8px; text-transform:uppercase;
  color: var(--text-secondary); user-select:none;
}
#mode-toggle:hover, #roteiro-btn:hover {
  border-color: var(--brand-primary); color: var(--brand-primary);
  background: var(--brand-primary-dim);
}
#mode-toggle:active, #roteiro-btn:active { transform: scale(.96); }
#roteiro-btn.open {
  border-color: var(--brand-primary); color: var(--brand-primary);
  background: var(--brand-primary-dim);
}
/* Pip olive — acende nos dois modos */
.toggle-pip {
  width:9px; height:9px; border-radius:50%;
  background: var(--brand-primary);
  box-shadow: 0 0 7px var(--brand-primary-glow); flex-shrink:0;
}
#mode-toggle:hover .toggle-pip,
#roteiro-btn:hover .toggle-pip,
#roteiro-btn.open .toggle-pip { box-shadow: 0 0 12px var(--brand-primary-glow); }

/* ── TYPOGRAPHY ─────────────────────────────────── */
.eyebrow {
  display:inline-flex; align-items:center; gap:6px;
  font-family: var(--font-mono); font-size:11px;
  letter-spacing:2px; text-transform:uppercase;
  color: var(--brand-primary); margin-bottom:16px;
}
.eyebrow::before { content:''; width:6px; height:6px; border-radius:50%; background: var(--brand-primary); }
.slide-title {
  font-family: var(--font-headline); font-size: var(--fs-h1);
  font-weight:800; line-height:1.1; letter-spacing:-1px; margin-bottom:12px;
}
.slide-subtitle {
  font-size: var(--fs-body-lg); color: var(--text-secondary);
  max-width:500px; margin-bottom:40px; line-height:1.4;
}
.gradient-text {
  background: linear-gradient(135deg, var(--gt1), var(--gt2), var(--gt3));
  -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
}
.section-label {
  font-family: var(--font-mono); font-size:11px;
  letter-spacing:2px; text-transform:uppercase; color: var(--text-muted); margin-bottom:24px;
}

/* ── BADGES ─────────────────────────────────────── */
.badge { display:inline-block; padding:3px 10px; border-radius:4px; font-family:var(--font-mono); font-size:10px; letter-spacing:1px; text-transform:uppercase; font-weight:600; }
.badge-primary   { background:var(--brand-primary-dim);   color:var(--brand-primary); }
.badge-success   { background:var(--brand-success-dim);   color:var(--brand-success); }
.badge-error     { background:var(--brand-error-dim);     color:var(--brand-error); }
.badge-secondary { background:var(--brand-secondary-dim); color:var(--brand-secondary); }
.badge-live { background:var(--brand-success-dim); color:var(--brand-success); animation:pulse-badge 2s infinite; }
.badge-live::before { content:''; width:6px; height:6px; border-radius:50%; background:var(--brand-success); display:inline-block; margin-right:6px; }
@keyframes pulse-badge { 0%,100%{opacity:1} 50%{opacity:.6} }

/* ── COMPONENT CARDS ────────────────────────────── */
.comp-grid   { display:grid; gap:16px; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); }
.comp-grid-3 { grid-template-columns:repeat(3,1fr); }
.comp-grid-2 { grid-template-columns:repeat(2,1fr); }
.comp-card {
  background:var(--brand-surface); border:1px solid var(--brand-border);
  border-radius:var(--radius); padding:24px; position:relative; transition:all .3s ease; overflow:hidden;
}
.comp-card:hover { border-color:var(--brand-border-hi); transform:translateY(-2px); }
.comp-card.highlighted { border-color:var(--brand-primary); box-shadow:0 0 20px var(--brand-primary-dim),inset 0 0 20px var(--brand-primary-dim); }
.comp-card-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
.comp-card-num    { font-family:var(--font-mono); font-size:12px; color:var(--brand-primary); font-weight:600; }
.comp-card-label  { font-family:var(--font-mono); font-size:11px; color:var(--text-muted); letter-spacing:1.5px; text-transform:uppercase; }
.comp-card-visual { min-height:120px; display:flex; align-items:center; justify-content:center; margin-bottom:16px; }
.comp-card-title  { font-size:18px; font-weight:700; margin-bottom:6px; }
.comp-card-desc   { font-size:13px; color:var(--text-secondary); line-height:1.5; }

/* ── STAT CARDS ─────────────────────────────────── */
.stat-row  { display:flex; gap:16px; flex-wrap:wrap; }
.stat-card { flex:1; min-width:200px; background:var(--brand-surface); border:1px solid var(--brand-border); border-radius:var(--radius); padding:20px 24px; }
.stat-value { font-size:36px; font-weight:800; font-family:var(--font-headline); }
.stat-unit  { font-size:14px; font-weight:400; color:var(--text-secondary); }
.stat-label { font-size:13px; color:var(--text-secondary); margin-top:4px; }

/* ── COVER LAYOUT ───────────────────────────────── */
.cover-layout { display:flex; flex-direction:column; justify-content:center; height:calc(100vh - 156px); }
.cover-stats  { display:flex; gap:16px; margin-top:44px; }
.cover-stat   { background:var(--brand-surface); border:1px solid var(--brand-border); border-radius:var(--radius); padding:18px 24px; flex:1; }
.cover-stat-val   { font-size:30px; font-weight:800; color:var(--brand-primary); font-family:var(--font-headline); }
.cover-stat-label { font-size:12px; color:var(--text-secondary); margin-top:3px; }

/* ── AGENDA ─────────────────────────────────────── */
.agenda-layout { display:grid; grid-template-columns:1fr 1.1fr; gap:56px; align-items:center; min-height:calc(100vh - 200px); }
.agenda-list   { display:flex; flex-direction:column; gap:6px; }
.agenda-item   { display:flex; align-items:center; gap:14px; padding:12px 18px; background:var(--brand-surface); border:1px solid var(--brand-border); border-radius:var(--radius-sm); cursor:pointer; transition:all .25s; }
.agenda-item:hover { border-color:var(--brand-primary); background:var(--brand-surface-2); }
.agenda-item-num     { font-family:var(--font-mono); font-size:18px; font-weight:700; color:var(--brand-primary); min-width:32px; }
.agenda-item-content { flex:1; }
.agenda-item-title   { font-size:14px; font-weight:600; }
.agenda-item-desc    { font-size:11px; color:var(--text-secondary); }
.agenda-item-arrow   { color:var(--text-muted); font-size:16px; transition:transform .2s; }
.agenda-item:hover .agenda-item-arrow { transform:translateX(4px); color:var(--brand-primary); }

/* ── TERMINAL ───────────────────────────────────── */
.terminal       { background:#0D1117; border:1px solid #21262D; border-radius:var(--radius); overflow:hidden; font-family:var(--font-mono); font-size:12px; }
.terminal-bar   { display:flex; align-items:center; gap:8px; padding:9px 14px; background:#161B22; border-bottom:1px solid #21262D; }
.terminal-dot   { width:10px; height:10px; border-radius:50%; }
.terminal-body  { padding:14px; line-height:1.7; color:#C9D1D9; }
.terminal-prompt  { color:var(--brand-success); } .terminal-cmd    { color:#E8E6E3; }
.terminal-comment { color:#484F58; }              .terminal-string { color:#A5D6FF; }
.terminal-keyword { color:#FF7B72; }              .terminal-func   { color:#D2A8FF; }
.terminal-number  { color:#79C0FF; }              .terminal-output { color:#8B949E; }
.terminal-cursor  { display:inline-block; width:8px; height:15px; background:var(--brand-primary); animation:blink 1s step-end infinite; vertical-align:text-bottom; }
@keyframes blink { 50%{opacity:0} }
.diff-add  { color:var(--brand-success); background:var(--brand-success-dim); display:block; padding:0 8px; margin:0 -14px; }
.diff-del  { color:var(--brand-error);   background:var(--brand-error-dim);   display:block; padding:0 8px; margin:0 -14px; }
.diff-info { color:var(--brand-secondary); }

/* ── FLOW / PIPELINE ────────────────────────────── */
.flow-nodes { display:flex; align-items:center; justify-content:center; gap:0; position:relative; }
.flow-node  { padding:10px 20px; border-radius:var(--radius-sm); font-family:var(--font-mono); font-size:12px; font-weight:600; letter-spacing:1px; text-transform:uppercase; border:1px solid var(--brand-border); background:var(--brand-surface); position:relative; z-index:2; transition:all .3s; }
.flow-node.active  { border-color:var(--brand-primary); color:var(--brand-primary); box-shadow:0 0 12px var(--brand-primary-dim); }
.flow-node.success { border-color:var(--brand-success); color:var(--brand-success); }
.flow-node.error   { border-color:var(--brand-error);   color:var(--brand-error); }
.flow-edge     { width:40px; height:2px; background:var(--brand-border); position:relative; }
.flow-edge-dot { position:absolute; top:50%; left:0; transform:translateY(-50%); width:8px; height:8px; border-radius:50%; background:var(--brand-primary); animation:flowDot 2s linear infinite; }
@keyframes flowDot { from{left:0} to{left:calc(100% - 8px)} }
.glow-line { stroke-dasharray:40 160; stroke-dashoffset:0; animation:glowFlow 3s linear infinite; }
@keyframes glowFlow { to{stroke-dashoffset:-200} }
.progress-ring-circle { transition:stroke-dashoffset .5s ease; transform:rotate(-90deg); transform-origin:50% 50%; }

/* ── ANIMATION CLASSES ──────────────────────────── */
.animate { opacity:0; transform:translateY(18px); transition:opacity .7s ease, transform .7s ease; }
.animate.in { opacity:1; transform:translateY(0); }
.delay-1{transition-delay:80ms;} .delay-2{transition-delay:160ms;} .delay-3{transition-delay:240ms;} .delay-4{transition-delay:320ms;} .delay-5{transition-delay:400ms;}
@keyframes fadeUp { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }

/* ── DETAIL PANEL ───────────────────────────────── */
.detail-panel { background:var(--brand-surface); border:1px solid var(--brand-border); border-radius:var(--radius); padding:24px; margin-top:16px; display:none; animation:fadeUp .3s ease; }
.detail-panel.visible { display:block; }

/* ── UTILITIES ──────────────────────────────────── */
.mt-8{margin-top:8px;} .mt-16{margin-top:16px;} .mt-24{margin-top:24px;} .mt-32{margin-top:32px;}
.mb-16{margin-bottom:16px;} .mb-24{margin-bottom:24px;}
.flex-between{display:flex;justify-content:space-between;align-items:center;}
.text-center{text-align:center;}

/* ── RESPONSIVE ─────────────────────────────────── */
@media(max-width:1100px){
  .slide{padding:44px 36px 100px;}
  .comp-grid-3{grid-template-columns:repeat(2,1fr);}
  .agenda-layout{grid-template-columns:1fr;gap:32px;}
}
@media(max-width:720px){
  .slide{padding:28px 20px 100px;}
  .comp-grid-3,.comp-grid-2{grid-template-columns:1fr;}
  .cover-stats{flex-direction:column;}
}
</style>
</head>
<body>

<div id="progress-bar"></div>

<main>
  {{SLIDES_CONTENT}}
</main>

<!-- ══════════════════════════════════════════════ BOTTOM NAV -->
<div id="bottom-nav">
  <button class="nav-arrow" onclick="prevSlide()">←</button>
  <div class="nav-dots" id="nav-dots"></div>
  <span id="slide-counter">01 / 01</span>
  <div class="nav-sep"></div>
  <button id="roteiro-btn" onclick="toggleRoteiro()" title="Abrir roteiro de apresentação">
    <span class="toggle-pip"></span>
    <span>R</span>
  </button>
  <button id="mode-toggle" onclick="toggleMode()" title="Alternar modo claro / escuro">
    <span class="toggle-pip"></span>
    <span id="mode-label">CLARO</span>
  </button>
  <button class="nav-arrow" onclick="nextSlide()">→</button>
</div>

<script>
/* ══════════════════════════════════════════════════
   ENGINE — Navegação, animações, contadores
══════════════════════════════════════════════════ */
const slides = document.querySelectorAll('.slide');
const totalSlides = slides.length;
let currentSlide = 0;
window._cs = 0; // exposto para popup (let nao e propriedade de window)

function goToSlide(n) {
  slides[currentSlide].classList.remove('active');
  currentSlide = Math.max(0, Math.min(n, totalSlides - 1));
  window._cs = currentSlide;
  slides[currentSlide].classList.add('active');
  updateNav(); triggerAnimations(); animateCounters();
}
function nextSlide() { goToSlide(currentSlide + 1); }
function prevSlide() { goToSlide(currentSlide - 1); }

function updateNav() {
  document.getElementById('progress-bar').style.width = ((currentSlide + 1) / totalSlides * 100) + '%';
  document.getElementById('slide-counter').textContent =
    String(currentSlide + 1).padStart(2,'0') + ' / ' + String(totalSlides).padStart(2,'0');
  document.querySelectorAll('.nav-dot').forEach((d,i) => d.classList.toggle('active', i === currentSlide));
}
(function() {
  const dotsEl = document.getElementById('nav-dots');
  for (let i = 0; i < totalSlides; i++) {
    const dot = document.createElement('div');
    dot.className = 'nav-dot' + (i === 0 ? ' active' : '');
    dot.onclick = () => goToSlide(i);
    dotsEl.appendChild(dot);
  }
})();

document.addEventListener('keydown', e => {
  if (['ArrowRight','ArrowDown',' '].includes(e.key)) { e.preventDefault(); nextSlide(); }
  if (['ArrowLeft','ArrowUp'].includes(e.key)) { e.preventDefault(); prevSlide(); }
  if (e.key === 'Home') { e.preventDefault(); goToSlide(0); }
  if (e.key === 'End')  { e.preventDefault(); goToSlide(totalSlides - 1); }
});
let touchStartX = 0;
document.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].screenX; });
document.addEventListener('touchend', e => {
  const diff = touchStartX - e.changedTouches[0].screenX;
  if (Math.abs(diff) > 50) { diff > 0 ? nextSlide() : prevSlide(); }
});

function triggerAnimations() {
  slides[currentSlide].querySelectorAll('.animate').forEach(el => el.classList.add('in'));
}
function animateCounters() {
  slides[currentSlide].querySelectorAll('[data-count]').forEach(el => {
    const target = parseInt(el.dataset.count);
    let cur = 0; const step = Math.ceil(target / 30);
    const intv = setInterval(() => {
      cur += step; if (cur >= target) { cur = target; clearInterval(intv); }
      el.textContent = cur;
    }, 30);
  });
}
function highlightCard(card) {
  card.parentElement.querySelectorAll('.comp-card').forEach(c => c.classList.remove('highlighted'));
  card.classList.add('highlighted');
  const detail = card.closest('.slide-inner').querySelector('.detail-panel');
  if (detail) detail.classList.add('visible');
}

/* ══════════════════════════════════════════════════
   DARK / LIGHT TOGGLE — Falconi Brand
   isDark = {{IS_DARK_DEFAULT}}
   olive #7A7423 é o acento em ambos os modos
══════════════════════════════════════════════════ */
let isDark = {{IS_DARK_DEFAULT}};

const fincodexDark = {
  '--brand-bg':'#1E0E05','--brand-surface':'#281408','--brand-surface-2':'#32180A',
  '--brand-border':'#3C1E0A','--brand-border-hi':'#503018',
  '--brand-primary':'#C08830','--brand-primary-dim':'rgba(192,136,48,0.18)',
  '--brand-primary-glow':'rgba(192,136,48,0.35)',
  '--brand-secondary':'#DCAA46','--brand-secondary-dim':'rgba(220,170,70,0.15)',
  '--brand-success':'#4ADE80','--brand-success-dim':'rgba(74,222,128,0.15)',
  '--brand-error':'#EF4444','--brand-error-dim':'rgba(239,68,68,0.15)',
  '--brand-warning':'#FBBF24',
  '--text-primary':'#EAE0CC','--text-secondary':'#B4AA96','--text-muted':'#665A46',
  '--gt1':'#C08830','--gt2':'#DCAA46','--gt3':'#E6B858'
};
const fincodexLight = {
  '--brand-bg':'#EAE0CC','--brand-surface':'#F5EDD8','--brand-surface-2':'#E0D4BA',
  '--brand-border':'#D2C8AA','--brand-border-hi':'#BEB096',
  '--brand-primary':'#C08830','--brand-primary-dim':'rgba(192,136,48,0.12)',
  '--brand-primary-glow':'rgba(192,136,48,0.25)',
  '--brand-secondary':'#8C6018','--brand-secondary-dim':'rgba(140,96,24,0.12)',
  '--brand-success':'#276747','--brand-success-dim':'rgba(39,103,71,0.12)',
  '--brand-error':'#C0392B','--brand-error-dim':'rgba(192,57,43,0.12)',
  '--brand-warning':'#8C7800',
  '--text-primary':'#1E0E05','--text-secondary':'#503018','--text-muted':'#8C826E',
  '--gt1':'#C08830','--gt2':'#8C6018','--gt3':'#B07020'
};

function applyPalette(vars) {
  for (const [k,v] of Object.entries(vars))
    document.documentElement.style.setProperty(k, v);
}
function toggleMode() {
  isDark = !isDark;
  applyPalette(isDark ? fincodexDark : fincodexLight);
  document.getElementById('mode-label').textContent = isDark ? 'ESCURO' : 'CLARO';
}

/* ══════════════════════════════════════════════════
   ROTEIRO POPUP
   Dados: const roteiro = {{ROTEIRO_DATA}};
   Formato: [{slide:0, texto:"..."}, ...]
══════════════════════════════════════════════════ */
const roteiro = {{ROTEIRO_DATA}};
let roteiroWin = null;

function _wpm(text) {
  const words = text.trim().split(/\s+/).length;
  const mins  = Math.round(words / 130);
  return mins < 1 ? '< 1 min' : '≈ ' + mins + ' min';
}

function _buildPopup() {
  const items = roteiro.map((r, idx) => {
    const pN = r.slide - 1, nN = r.slide + 1;
    const words = r.texto.trim().split(/\s+/).length;
    const secs  = Math.max(30, Math.round(words / 130 * 60));
    return '<div class="ri" id="ri' + idx + '" data-slide="' + r.slide + '" data-secs="' + secs + '">'
      + '<div class="rih">'
        + '<div class="rim">'
          + '<span class="rin">Slide ' + String(r.slide + 1).padStart(2,'0') + '</span>'
          + '<span class="rit">' + _wpm(r.texto) + '</span>'
          + '<span class="rbadge">&#9654; EM EXIBI\u00c7\u00c3O</span>'
          + '<span class="rcd" id="cd' + idx + '"></span>'
        + '</div>'
        + '<div class="rinav">'
          + '<button onclick="nav(' + pN + ')">&#8592;</button>'
          + '<button onclick="nav(' + nN + ')">&#8594;</button>'
        + '</div>'
      + '</div>'
      + '<p class="rip">' + r.texto + '</p>'
    + '</div>';
  }).join('');

  const css = [
    '*{box-sizing:border-box;margin:0;padding:0}',

    ':root{--pbg:#111;--psurf:#1c1c1c;--psurf2:#252525;--pbrd:#333;--ptxt:#eaeaea;--pmuted:#777;--plow:#555;--pscroll:#444;--pact:#1e1d0a}',,
    'body.light{--pbg:#F4F4F3;--psurf:#FFFFFF;--psurf2:#EAEAE8;--pbrd:#D2D2D0;--ptxt:#0F0F0F;--pmuted:#888;--plow:#aaa;--pscroll:#ccc;--pact:#eae7c4}',

    'body{font-family:"Plus Jakarta Sans",sans-serif;background:var(--pbg);color:var(--ptxt);height:100vh;display:flex;flex-direction:column;overflow:hidden;transition:background .28s,color .28s}',

    /* header */
    '#tb{background:var(--psurf);border-bottom:1px solid var(--pbrd);padding:9px 12px;display:flex;align-items:center;gap:7px;flex-shrink:0}',
    '#td{font-family:"JetBrains Mono",monospace;font-size:19px;font-weight:700;color:#7A7423;letter-spacing:3px;flex:1}',
    '.pbtn{background:transparent;border:1px solid var(--pbrd);border-radius:6px;padding:4px 10px;color:var(--pmuted);cursor:pointer;font-size:10px;font-family:"JetBrains Mono",monospace;letter-spacing:1px;transition:all .18s;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}',
    '.pbtn:hover{border-color:#7A7423;color:#7A7423}',
    '#mpip{width:7px;height:7px;border-radius:50%;background:#7A7423;flex-shrink:0}',

    /* sync bar */
    '#sb{background:var(--psurf2);border-bottom:1px solid var(--pbrd);padding:7px 12px;flex-shrink:0}',
    '#sb label{font-size:11px;color:var(--pmuted);display:flex;align-items:center;gap:7px;cursor:pointer}',
    '#as{accent-color:#7A7423;cursor:pointer;width:13px;height:13px}',

    /* scroll */
    '#rs{overflow-y:auto;flex:1;padding:8px}',
    '#rs::-webkit-scrollbar{width:3px}',
    '#rs::-webkit-scrollbar-thumb{background:var(--pscroll);border-radius:2px}',

    /* bloco base */
    '.ri{border-radius:8px;padding:10px 12px;margin-bottom:7px;background:var(--psurf);border:1px solid var(--pbrd);border-left:3px solid transparent;transition:background .22s,border-color .22s,opacity .22s}',
    '.ri:not(.active){opacity:.40}',

    /* ── BLOCO ATIVO — destaque inequívoco ── */
    '.ri.active{opacity:1!important;background:var(--pact);border-color:#7A7423!important;border-left:4px solid #7A7423!important;box-shadow:0 0 0 1.5px #7A7423}',
    'body.light .ri:not(.active){background:#fff;opacity:.68}',
    'body.light .ri.active{background:var(--pact)!important;border-color:#7A7423!important;box-shadow:0 0 0 1.5px #7A7423}',

    /* header do item */
    '.rih{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px}',
    '.rim{display:flex;align-items:center;gap:6px;flex-wrap:wrap}',
    '.rin{font-family:"JetBrains Mono",monospace;font-size:10px;color:var(--plow);letter-spacing:1px;text-transform:uppercase}',
    '.ri.active .rin{color:#7A7423;font-weight:700}',
    '.rit{font-family:"JetBrains Mono",monospace;font-size:9px;background:var(--psurf2);color:var(--plow);padding:2px 6px;border-radius:4px}',
    '.ri.active .rit{background:rgba(122,116,35,0.18);color:#7A7423}',

    /* badge EM EXIBIÇÃO */
    '.rbadge{display:none;font-family:"JetBrains Mono",monospace;font-size:8px;letter-spacing:1px;text-transform:uppercase;background:#7A7423;color:#fff;padding:2px 7px;border-radius:4px;font-weight:700}',
    '.ri.active .rbadge{display:inline-block}',

    /* ── COUNTDOWN DECRESCENTE ── */
    '.rcd{display:none;font-family:"JetBrains Mono",monospace;font-size:11px;font-weight:700;color:#EF4444;background:rgba(239,68,68,0.12);padding:2px 7px;border-radius:4px;letter-spacing:1px;min-width:44px;text-align:center}',
    '.rcd.urgent{background:rgba(239,68,68,0.22);animation:pulse-cd .6s infinite}',
    '@keyframes pulse-cd{0%,100%{opacity:1}50%{opacity:.5}}',

    /* nav arrows */
    '.rinav{display:flex;gap:4px;flex-shrink:0}',
    '.rinav button{background:transparent;border:1px solid var(--pbrd);border-radius:4px;width:22px;height:22px;color:var(--pmuted);cursor:pointer;font-size:12px;transition:all .15s;display:flex;align-items:center;justify-content:center}',
    '.rinav button:hover{border-color:#7A7423;color:#7A7423}',

    /* texto */
    '.rip{font-size:11.5px;line-height:1.68;color:var(--pmuted)}',
    '.ri.active .rip{color:var(--ptxt);font-size:12px}',
  ].join('');

  const js = [
    'var on=false,s=0,iv,dark=true,lastSlide=-1,cdIv=null,cdSecs=0,cdEl=null;',

    /* timer global */
    'function tt(){on=!on;document.getElementById("tbt").innerHTML=on?"&#9646;&#9646; Pausar":"&#9654; Iniciar";',
    'if(on){iv=setInterval(function(){s++;var h=("0"+Math.floor(s/3600)).slice(-2),m=("0"+Math.floor(s%3600/60)).slice(-2),x=("0"+s%60).slice(-2);',
    'document.getElementById("td").textContent=h+":"+m+":"+x;},1000);}',
    'else{clearInterval(iv);s=0;document.getElementById("td").textContent="00:00:00";}}',

    /* modo claro/escuro */
    'function tm(){dark=!dark;document.body.classList.toggle("light",!dark);document.getElementById("mlbl").textContent=dark?"ESCURO":"CLARO";}',

    /* navegação */
    'function nav(n){try{window.opener.goToSlide(n);}catch(e){}}',

    /* countdown por slide */
    'function startCd(el,secs){',
    '  if(cdIv)clearInterval(cdIv);',
    '  cdEl=el;cdSecs=secs;',
    '  renderCd();',
    '  cdIv=setInterval(function(){',
    '    cdSecs=Math.max(0,cdSecs-1);renderCd();',
    '    if(cdSecs===0){clearInterval(cdIv);cdIv=null;}',
    '  },1000);}',
    'function renderCd(){',
    '  if(!cdEl)return;',
    '  var m=String(Math.floor(cdSecs/60)).padStart(2,"0");',
    '  var x=String(cdSecs%60).padStart(2,"0");',
    '  cdEl.textContent=m+":"+x;',
    '  cdEl.style.display="inline-block";',
    '  cdEl.classList.toggle("urgent",cdSecs>0&&cdSecs<=15);}',
    'function stopCd(){',
    '  if(cdIv){clearInterval(cdIv);cdIv=null;}',
    '  if(cdEl){cdEl.style.display="none";cdEl.textContent="";}',
    '  cdEl=null;}',

    /* sincronização */
    'function sync(){',
    '  var chk=document.getElementById("as").checked;',
    '  try{var cur=(window.opener._cs!==undefined?window.opener._cs:0);',
    '    document.querySelectorAll(".ri").forEach(function(el){',
    '      var a=parseInt(el.dataset.slide)===cur;',
    '      var was=el.classList.contains("active");',
    '      el.classList.toggle("active",a);',
    '      if(a){',
    '        el.scrollIntoView({block:"nearest",behavior:"smooth"});',
    '        if(chk&&(!was||lastSlide!==cur)){',
    '          var cde=el.querySelector(".rcd");',
    '          startCd(cde,parseInt(el.dataset.secs));',
    '        }',
    '      } else if(was){',
    '        var cde=el.querySelector(".rcd");',
    '        if(cde){cde.style.display="none";cde.textContent="";}',
    '      }',
    '    });',
    '    if(!chk&&cdIv)stopCd();',
    '    lastSlide=cur;',
    '  }catch(e){}}',

    /* checkbox liga/desliga countdown */
    'document.getElementById("as").addEventListener("change",function(){if(!this.checked)stopCd();});',

    'setInterval(sync,300);sync();',
  ].join('');

  return '<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8">'
    + '<title>Roteiro \u2014 ' + document.title.replace(/'/g,"\\'") + '</title>'
    + '<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">'
    + '<style>' + css + '</style></head><body>'
    + '<div id="tb">'
      + '<span id="td">00:00:00</span>'
      + '<button id="tbt" class="pbtn" onclick="tt()">&#9654; Iniciar</button>'
      + '<button class="pbtn" onclick="tm()"><span id="mpip"></span><span id="mlbl">ESCURO</span></button>'
    + '</div>'
    + '<div id="sb"><label><input type="checkbox" id="as" checked> Sincronizar com slide ativo automaticamente</label></div>'
    + '<div id="rs">' + items + '</div>'
    + '<scr'+'ipt>' + js + '<\/script></body></html>';
}

function toggleRoteiro() {
  const btn = document.getElementById('roteiro-btn');
  if (roteiroWin && !roteiroWin.closed) {
    roteiroWin.close(); roteiroWin = null;
    btn.classList.remove('open'); return;
  }
  const pw = 380, ph = 560;
  const left = Math.max(0, window.screenX + window.outerWidth - pw - 14);
  const top  = Math.max(0, window.screenY + 40);
  roteiroWin = window.open('', 'falconi_roteiro',
    'width='+pw+',height='+ph+',left='+left+',top='+top+
    ',resizable=yes,scrollbars=no,toolbar=no,menubar=no,location=no,status=no');
  if (!roteiroWin) {
    alert('Popup bloqueado. Permita popups para esta página e tente novamente.');
    return;
  }
  roteiroWin.document.write(_buildPopup());
  roteiroWin.document.close();
  btn.classList.add('open');
  const chk = setInterval(function() {
    if (!roteiroWin || roteiroWin.closed) {
      btn.classList.remove('open'); roteiroWin = null; clearInterval(chk);
    }
  }, 500);
}

/* ── INIT ───────────────────────────────────────── */
if (slides.length > 0) {
  slides[0].classList.add('active');
  updateNav(); triggerAnimations(); animateCounters();
}
</script>
